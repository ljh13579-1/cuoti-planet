<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160812"/>
      <stop offset=".45" stop-color="#3d1426"/>
      <stop offset="1" stop-color="#6b2626"/>
    </linearGradient>
    <radialGradient id="ambient" cx=".5" cy=".4" r=".7">
      <stop offset="0" stop-color="#ff9a62" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#e0543a" stop-opacity=".18"/>
      <stop offset="1" stop-color="#180710" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalA" x1=".2" y1="1" x2=".8" y2="0">
      <stop offset="0" stop-color="#54101c" stop-opacity=".1"/>
      <stop offset=".38" stop-color="#c0392b" stop-opacity=".5"/>
      <stop offset=".7" stop-color="#fb7c4a" stop-opacity=".82"/>
      <stop offset="1" stop-color="#ffe0b2" stop-opacity=".98"/>
    </linearGradient>
    <linearGradient id="petalB" x1=".3" y1="1" x2=".7" y2="0">
      <stop offset="0" stop-color="#3d0d36" stop-opacity=".1"/>
      <stop offset=".4" stop-color="#9d2d73" stop-opacity=".55"/>
      <stop offset=".72" stop-color="#e879b9" stop-opacity=".78"/>
      <stop offset="1" stop-color="#ffd6ef" stop-opacity=".94"/>
    </linearGradient>
    <linearGradient id="petalC" x1=".3" y1="1" x2=".7" y2="0">
      <stop offset="0" stop-color="#3c1a10" stop-opacity=".1"/>
      <stop offset=".4" stop-color="#b34b1f" stop-opacity=".45"/>
      <stop offset=".75" stop-color="#f6c453" stop-opacity=".8"/>
      <stop offset="1" stop-color="#fff2c4" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e7"/>
      <stop offset=".5" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ff8fb4"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb37b" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f7a06b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".5" cy=".5" r=".8">
      <stop offset=".42" stop-color="#14040a" stop-opacity="0"/>
      <stop offset=".82" stop-color="#0b0206" stop-opacity=".35"/>
      <stop offset="1" stop-color="#060103" stop-opacity=".78"/>
    </radialGradient>
    <filter id="soft" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="42"/></filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="980" cy="420" rx="1000" ry="760" fill="url(#ambient)"/>

  <g filter="url(#soft2)" opacity=".55">
    <g transform="translate(960 480)">
      <path transform="rotate(-12)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="#b91c1c"/>
      <path transform="rotate(72)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="#c2410c"/>
      <path transform="rotate(152)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="#7c2d50"/>
      <path transform="rotate(232)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="#9a3412"/>
      <path transform="rotate(302)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="#be185d"/>
    </g>
  </g>

  <g filter="url(#soft)" style="mix-blend-mode:screen" opacity=".88">
    <g transform="translate(960 480)">
      <path transform="rotate(-12) scale(.94)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalA)"/>
      <path transform="rotate(72) scale(.9)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalB)"/>
      <path transform="rotate(152) scale(.92)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalC)"/>
      <path transform="rotate(232) scale(.88)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalB)"/>
      <path transform="rotate(302) scale(.9)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalA)"/>
    </g>
  </g>

  <g filter="url(#soft)" opacity=".72">
    <g transform="translate(960 480)">
      <path transform="rotate(28) scale(.48)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalC)"/>
      <path transform="rotate(118) scale(.44)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalB)"/>
      <path transform="rotate(208) scale(.5)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalA)"/>
      <path transform="rotate(292) scale(.42)" d="M0,80 C-160,-40 -320,-160 -330,-350 C-340,-500 -210,-590 -80,-570 C80,-545 180,-400 160,-255 C145,-115 65,-5 0,80Z" fill="url(#petalC)"/>
    </g>
  </g>

  <ellipse cx="960" cy="480" rx="170" ry="130" fill="url(#core)" opacity=".5" filter="url(#glow)"/>
  <ellipse cx="960" cy="480" rx="50" ry="38" fill="#fff9ef" opacity=".7" filter="url(#soft2)"/>

  <g fill="none" stroke="url(#ribbon)">
    <path d="M160,840 C430,760 520,560 880,500 C1240,442 1500,620 1800,500" stroke-width="4"/>
    <path d="M220,960 C520,880 760,740 1080,700 C1440,655 1640,780 1880,720" stroke-width="2" opacity=".6"/>
    <path d="M1260,260 C1450,360 1600,260 1810,320" stroke-width="2" opacity=".5"/>
  </g>
  <g fill="none" stroke="#ffe8d2" opacity=".25" filter="url(#soft)">
    <path d="M580,760 C720,620 660,470 860,420" stroke-width="2"/>
    <path d="M1160,820 C1310,680 1480,720 1550,600" stroke-width="2"/>
  </g>

  <g filter="url(#soft2)" opacity=".5">
    <path d="M-100,900 C300,820 580,940 900,830 C1140,750 1200,640 1420,690" fill="none" stroke="url(#ribbon)" stroke-width="120" stroke-linecap="round"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
