<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c0f"/>
      <stop offset=".5" stop-color="#151a20"/>
      <stop offset="1" stop-color="#242b33"/>
    </linearGradient>
    <radialGradient id="ambient" cx=".58" cy=".45" r=".6">
      <stop offset="0" stop-color="#cbd5e1" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#94a3b8" stop-opacity=".06"/>
      <stop offset="1" stop-color="#0a0c0f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#cbd5e1" stop-opacity=".5"/>
      <stop offset="1" stop-color="#64748b" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="silver2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2e8f0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f1f5f9" stop-opacity=".55"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx=".55" cy=".45" r=".8">
      <stop offset=".4" stop-color="#050607" stop-opacity="0"/>
      <stop offset=".82" stop-color="#030405" stop-opacity=".4"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".8"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft2" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <ellipse cx="1120" cy="500" rx="900" ry="700" fill="url(#ambient)"/>

  <!-- soft metallic bloom -->
  <g filter="url(#soft2)" opacity=".5">
    <g transform="translate(1180 500)">
      <path transform="rotate(-30)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="#475569"/>
      <path transform="rotate(40)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="#94a3b8"/>
      <path transform="rotate(120)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="#334155"/>
      <path transform="rotate(200)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="#64748b"/>
      <path transform="rotate(280)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="#475569"/>
    </g>
  </g>

  <g filter="url(#soft)" style="mix-blend-mode:screen" opacity=".5">
    <g transform="translate(1180 500)">
      <path transform="rotate(-30) scale(.88)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="url(#silver)"/>
      <path transform="rotate(40) scale(.82)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="url(#silver)"/>
      <path transform="rotate(120) scale(.86)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="url(#silver)"/>
      <path transform="rotate(200) scale(.8)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="url(#silver)"/>
      <path transform="rotate(280) scale(.84)" d="M0,60 C-130,-40 -270,-150 -280,-310 C-290,-450 -180,-530 -70,-515 C70,-495 155,-365 140,-230 C125,-100 55,-5 0,60Z" fill="url(#silver)"/>
    </g>
  </g>

  <ellipse cx="1180" cy="500" rx="120" ry="90" fill="#f8fafc" opacity=".12" filter="url(#soft2)"/>

  <!-- contour lines -->
  <g fill="none" stroke="url(#silver2)" stroke-linecap="round">
    <path d="M-100,880 C280,760 560,920 920,800 C1280,680 1460,530 1820,600 C1880,612 1950,600 2020,580" stroke-width="1.6" opacity=".55"/>
    <path d="M-100,920 C300,800 620,980 1000,850 C1380,720 1580,610 2000,660" stroke-width="1" opacity=".36"/>
    <path d="M-120,800 C260,690 520,850 880,740 C1240,630 1400,470 1740,540" stroke-width=".8" opacity=".3"/>
    <path d="M320,220 C540,340 760,230 1020,300 C1300,375 1440,260 1640,330" stroke-width="1.2" opacity=".3"/>
    <path d="M700,140 C900,250 1140,170 1380,240" stroke-width=".7" opacity=".2"/>
    <path d="M240,640 C480,560 660,680 920,600 C1180,520 1300,400 1560,440" stroke-width=".7" opacity=".22"/>
  </g>

  <!-- bright arcs -->
  <g fill="none" filter="url(#soft)">
    <path d="M600,280 C820,200 1030,270 1130,430" stroke="#f8fafc" stroke-width="2" opacity=".35"/>
    <path d="M1400,760 C1560,660 1700,690 1790,600" stroke="#e2e8f0" stroke-width="2" opacity=".28"/>
  </g>

  <!-- faint grid speck -->
  <g fill="#f8fafc">
    <circle cx="760" cy="420" r="1" opacity=".3"/>
    <circle cx="1320" cy="320" r=".8" opacity=".24"/>
    <circle cx="1500" cy="620" r="1.2" opacity=".2"/>
    <circle cx="980" cy="700" r=".8" opacity=".22"/>
  </g>

  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
